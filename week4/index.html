<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Perspective Stream | 2D Social Engine</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; background: #f0f2f5; }
        
        #searchContainer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 600px;
            z-index: 1000;
            text-align: center;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.has-results #searchContainer {
            top: 50px;
            max-width: 850px;
        }

        h1.logo {
            font-size: 2.8rem;
            color: #1c1e21;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
        }
        
        body.has-results h1.logo {
            font-size: 1.3rem;
            display: inline-block;
            margin-right: 20px;
            margin-bottom: 0;
            vertical-align: middle;
        }

        .input-group {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        body.has-results .input-group {
            width: 65%;
            vertical-align: middle;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 28px;
            font-size: 17px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            outline: none;
        }

        #status {
            margin-top: 15px;
            color: #65676b;
            font-size: 13px;
            height: 20px;
            opacity: 0;
        }

        #footerInfo {
            position: fixed;
            bottom: 15px;
            left: 20px;
            font-size: 11px;
            color: #bcc0c4;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="searchContainer">
        <h1 class="logo">Perspective<span style="color:#0084ff">Stream</span></h1>
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="输入话题，观察 AI 模拟的 15 种观点分布..." autocomplete="off">
        </div>
        <div id="status">准备就绪</div>
    </div>

    <div id="footerInfo">语义映射布局 • 自动折叠长文本 • 额度守护模式</div>

    <script type="module">
        import { UMAP } from "https://cdn.skypack.dev/umap-js";

        let canvas, ctx;
        let people = {}; 
        let drawOrder = []; 
        let hoveredPersonID = null;
        let isSearching = false;
        
        // 你的代理地址
        const replicateProxy = "https://itp-ima-replicate-proxy.web.app/api/create_n_get";

        window.onload = () => {
            initCanvas();
            setupUI();
            animate();
            
            // 恢复本地存储
            const saved = localStorage.getItem('perspective_stream_v2');
            if(saved) {
                try {
                    people = JSON.parse(saved);
                    for(let id in people) reloadImage(people[id]);
                    drawOrder = Object.keys(people);
                    if(drawOrder.length > 0) {
                        document.body.classList.add('has-results');
                        projectNormalizedToCanvas();
                    }
                } catch(e) { localStorage.removeItem('perspective_stream_v2'); }
            }
        };

        function setupUI() {
            const input = document.getElementById('searchInput');
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const topic = input.value.trim();
                    if (topic) startSearch(topic);
                }
            });
        }

        function initCanvas() {
            canvas = document.createElement('canvas');
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            document.body.appendChild(canvas);
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                projectNormalizedToCanvas(); 
            });
            canvas.addEventListener('mousemove', handleMouseMove);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx = canvas.getContext('2d');
        }

        async function startSearch(topic) {
            if(isSearching) return;
            isSearching = true;
            updateStatus("AI 正在构建视角...", 1);
            document.body.classList.add('has-results');

            try {
                people = {};
                drawOrder = [];

                // 1. 调用 LLM 生成 15 条观点
                const systemPrompt = `Create 15 diverse personas with distinct perspectives. Return a flat JSON array of objects with: name, handle, content (1-2 sentences), type (category), image_seed (a random unique string).`;
                const fullPrompt = `Generate 15 perspectives about "${topic}" in JSON.`;

                const llmData = await fetchAI('openai/gpt-4o', { prompt: fullPrompt, system_prompt: systemPrompt });
                
                let results = [];
                const raw = llmData.output?.json_output || llmData.output;
                if (Array.isArray(raw)) results = raw;
                else if (typeof raw === 'string') results = JSON.parse(raw.replace(/```json|```/g, ""));
                else if (raw?.items) results = raw.items;

                if (!Array.isArray(results)) throw new Error("无法解析 AI 返回的数据");
                results = results.slice(0, 15);

                // 2. 语义嵌入 (Embedding) - 决定布局
                updateStatus("计算语义距离...", 1);
                const textForEmbed = results.map(r => `${r.type}: ${r.content}`);
                const embedRes = await fetchAI('beautyyuyanli/multilingual-e5-large:a06276a89f1a902d5fc225a9ca32b6e8e6292b7f3b136518878da97c458e2bad', {
                    texts: JSON.stringify(textForEmbed)
                });

                // 3. 构建对象并加载免费头像
                results.forEach((p, index) => {
                    const id = `user_${index}`;
                    people[id] = { 
                        ...p, 
                        id, 
                        embedding: embedRes.output[index],
                        img: null, 
                        imageLoading: true 
                    };
                    drawOrder.push(id);
                    // 使用 DiceBear 免费库，根据 handle 生成唯一头像，不消耗 AI 额度
                    loadFreeAvatar(id, p.handle);
                });

                // 4. 运行布局算法
                runUMAP();
                
                updateStatus("分析完成", 0);
                localStorage.setItem('perspective_stream_v2', JSON.stringify(people));

            } catch (e) {
                console.error(e);
                updateStatus("错误: " + e.message, 1);
            } finally {
                isSearching = false;
            }
        }

        // 免费头像加载器
        function loadFreeAvatar(id, seed) {
            const cleanSeed = seed.replace('@', '');
            const avatarUrl = `https://api.dicebear.com/7.x/avataaars/svg?seed=${cleanSeed}`;
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = avatarUrl;
            img.onload = () => {
                people[id].img = img;
                people[id].imageURL = avatarUrl;
                people[id].imageLoading = false;
            };
            img.onerror = () => { people[id].imageLoading = false; };
        }

        function runUMAP() {
            const ids = drawOrder.filter(id => people[id].embedding);
            if(ids.length < 2) return;

            const embeddings = ids.map(id => people[id].embedding);
            const nNeighbors = Math.min(5, ids.length - 1);
            
            try {
                const umap = new UMAP({ nNeighbors, minDist: 0.7, nComponents: 2 });
                const fittings = umap.fit(embeddings);
                const normalized = normalize(fittings);
                
                ids.forEach((id, i) => {
                    people[id].normalizedX = normalized[i][0];
                    people[id].normalizedY = normalized[i][1];
                });
                projectNormalizedToCanvas();
            } catch(e) { console.warn("UMAP Layout failed, using fallback."); }
        }

        function normalize(vectors) {
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            vectors.forEach(v => {
                minX = Math.min(minX, v[0]); maxX = Math.max(maxX, v[0]);
                minY = Math.min(minY, v[1]); maxY = Math.max(maxY, v[1]);
            });
            return vectors.map(v => [ (v[0]-minX)/(maxX-minX||1), (v[1]-minY)/(maxY-minY||1) ]);
        }

        function projectNormalizedToCanvas() {
            const margin = 100;
            const w = canvas.width - margin * 2;
            const h = canvas.height - 200;
            const topOffset = 150;

            for(let id in people) {
                const p = people[id];
                p.w = 360; p.h = 100; 
                p.x = margin + p.normalizedX * (w - p.w);
                p.y = topOffset + p.normalizedY * (h - topOffset);
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawOrder.forEach(id => {
                const p = people[id];
                if(!p.x) return;

                ctx.save();
                ctx.shadowColor = 'rgba(0,0,0,0.06)';
                ctx.shadowBlur = 15;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 16);
                ctx.fill();

                // 头像
                const avSize = 60;
                const avX = p.x + 18;
                const avY = p.y + (p.h - avSize) / 2;

                ctx.save();
                ctx.beginPath();
                ctx.arc(avX + avSize/2, avY + avSize/2, avSize/2, 0, Math.PI*2);
                ctx.clip();
                if(p.img && !p.imageLoading) {
                    ctx.drawImage(p.img, avX, avY, avSize, avSize);
                } else {
                    ctx.fillStyle = '#f3f4f6';
                    ctx.fill();
                }
                ctx.restore();

                // 文本
                const textX = avX + avSize + 15;
                const textW = p.w - avSize - 55;

                ctx.fillStyle = '#1c1e21';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText(p.name, textX, p.y + 36);
                
                const nw = ctx.measureText(p.name).width;
                ctx.fillStyle = '#8e9194';
                ctx.font = '13px sans-serif';
                ctx.fillText(p.handle, textX + nw + 8, p.y + 36);

                ctx.fillStyle = '#2d2e30';
                ctx.font = '14px sans-serif';
                wrapText(ctx, p.content, textX, p.y + 60, textW, 20);

                if(hoveredPersonID === id) {
                    ctx.strokeStyle = '#0084ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, p.y, p.w, p.h);
                }
                ctx.restore();
            });
            requestAnimationFrame(animate);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            if(!text) return;
            const words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else { line = testLine; }
            }
            context.fillText(line, x, y);
        }

        function handleMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            let hit = null;
            for(let i = drawOrder.length - 1; i >= 0; i--) {
                const p = people[drawOrder[i]];
                if (p.x && mx >= p.x && mx <= p.x+p.w && my >= p.y && my <= p.y+p.h) {
                    hit = drawOrder[i]; break;
                }
            }
            hoveredPersonID = hit;
            canvas.style.cursor = hit ? 'pointer' : 'default';
        }

        async function fetchAI(model, input) {
            const res = await fetch(replicateProxy, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ model, input }),
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            return data;
        }

        function updateStatus(text, opacity) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.style.opacity = opacity;
        }

        function reloadImage(p) {
            if(p.imageURL) {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = p.imageURL;
                p.img = img;
                p.imageLoading = false;
            }
        }
    </script>
</body>
</html>
