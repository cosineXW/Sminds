<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awakening Underwater</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: sans-serif; color: white; }
        #webcam { position: fixed; width: 640px; height: 480px; visibility: hidden; pointer-events: none; }
        #ui {
            position: fixed; top: 10px; left: 10px; z-index: 10;
            background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 8px;
            font-size: 13px; line-height: 1.6; max-width: 320px;
            backdrop-filter: blur(4px);
        }
        #ui h3 { font-size: 14px; margin-bottom: 4px; }
        #ui p { opacity: 0.7; font-size: 12px; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
    <!-- MediaPipe Hands: supports dual hand detection (ml5 handpose only detects one hand) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="ui">
        <h3 id="status">Loading AI models...</h3>
        <p>Turn head left/right → Pan view horizontally</p>
        <p>Reach out hand → Push seaweed/lotus leaves, change fish direction</p>
        <p id="debug"></p>
    </div>
    <video id="webcam" playsinline autoplay width="640" height="480"></video>

<script>
// --- Perlin Noise ---
const PerlinNoise = (() => {
    const p = [];
    const permutation = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
    for (let i = 0; i < 256; i++) p[i] = p[i + 256] = permutation[i];
    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function lerp(a, b, t) { return a + t * (b - a); }
    function grad(hash, x, y, z) {
        const h = hash & 15;
        const u = h < 8 ? x : y;
        const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
        return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
    }
    return {
        noise(x, y, z = 0) {
            const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
            x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
            const u = fade(x), v = fade(y), w = fade(z);
            const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
            const B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
            return lerp(
                lerp(lerp(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u),
                     lerp(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
                lerp(lerp(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u),
                     lerp(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
        }
    };
})();

// --- Global variables ---
let scene, camera, cameraGroup, renderer;
let faceMesh, video;
let facePredictions = [];
let isFaceReady = false, isHandReady = false;
let mpHandResults = null;
let fishes = [];
let weeds = [];
let lotusLeaves = [];
let godRays = [];
let handWorldPositions = [new THREE.Vector3(), new THREE.Vector3()];
let handActive = false;
let activeHandCount = 0;
const handArray = [
    1, 2, 3, 4, 3, 2, 5, 6, 7, 8, 7, 6, 5,
    9, 10, 11, 12, 11, 10, 9, 13, 14, 15, 16,
    15, 14, 13, 17, 18, 19, 20, 19, 18, 17, 0
];
let handLineMeshes = [null, null];
let handGlows = [null, null];
const raycaster = new THREE.Raycaster();
raycaster.far = 30;
let rayTargets = [];
let highlightedObjects = new Set();
const clock = new THREE.Clock();
const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');

// --- Startup ---
window.onload = async () => {
    initThreeJS();
    createScene();
    await initWebcam();
    initMl5();
    animate();
};

// --- 1. Three.js initialization —supine underwater perspective ---
function initThreeJS() {
    scene = new THREE.Scene();
    // Shallow underwater background — brighter, more sunlit
    scene.background = new THREE.Color(0x0a2a3a);
    scene.fog = new THREE.FogExp2(0x0a2a3a, 0.014);

    // Camera group: simulates head turning left/right while lying down
    cameraGroup = new THREE.Group();
    scene.add(cameraGroup);

    camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 200);
    // Supine: camera facing straight up (+Y)
    camera.rotation.order = 'YXZ';
    camera.rotation.x = Math.PI / 2;
    camera.position.set(0, 0, 0);
    cameraGroup.add(camera);
    cameraGroup.position.set(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Ambient light — warmer and brighter for shallow water
    const ambientLight = new THREE.AmbientLight(0x3a6a8a, 0.8);
    scene.add(ambientLight);

    // Strong sunlight from above
    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(2, 50, 1);
    scene.add(dirLight);

    // Secondary warm fill light to simulate sunlight scattering
    const warmLight = new THREE.DirectionalLight(0xffcc88, 0.4);
    warmLight.position.set(-5, 40, -3);
    scene.add(warmLight);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

// --- 2. Build underwater scene ---
function createScene() {
    createWaterSurface();
    createGodRays();
    createFishes();
    createLotusLeaves();
    createWeeds();
    createBubbles();
    createHandOutline();
    buildRayTargets();
}

// --- Hand outline ---
function createHandOutline() {
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 64; glowCanvas.height = 64;
    const gCtx = glowCanvas.getContext('2d');
    const gradient = gCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(120, 200, 255, 0.4)');
    gradient.addColorStop(0.5, 'rgba(80, 160, 220, 0.15)');
    gradient.addColorStop(1, 'rgba(40, 100, 180, 0)');
    gCtx.fillStyle = gradient;
    gCtx.fillRect(0, 0, 64, 64);
    const glowTex = new THREE.CanvasTexture(glowCanvas);
    for (let h = 0; h < 2; h++) {
        const maxPoints = handArray.length + 1;
        const positions = new Float32Array(maxPoints * 3);
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setDrawRange(0, 0);
        const material = new THREE.LineBasicMaterial({
            color: 0x88ddff, transparent: true, opacity: 0.6, linewidth: 1,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        const lineMesh = new THREE.Line(geometry, material);
        lineMesh.visible = false;
        scene.add(lineMesh);
        handLineMeshes[h] = lineMesh;
        const spriteMat = new THREE.SpriteMaterial({
            map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const glow = new THREE.Sprite(spriteMat);
        glow.scale.set(4, 4, 1);
        glow.visible = false;
        scene.add(glow);
        handGlows[h] = glow;
    }
}

// --- Build ray target list from all interactive objects ---
function buildRayTargets() {
    rayTargets = [];
    // Fish bodies
    fishes.forEach(f => { if (f.body) rayTargets.push(f.body); });
    // Interactive lotus leaves
    lotusLeaves.forEach(l => { if (l.interactive) rayTargets.push(l.mesh); });
    // Interactive weed stalks (children of group)
    weeds.forEach(w => {
        if (w.interactive) {
            w.group.children.forEach(child => { if (child.isMesh) rayTargets.push(child); });
        }
    });
}

// --- Raycasting: detect what each hand is pointing at ---
function updateRaycasting() {
    // Reset all highlights
    highlightedObjects.forEach(obj => {
        if (obj.material && obj.material._origEmissive !== undefined) {
            obj.material.emissive.setHex(obj.material._origEmissive);
        }
    });
    highlightedObjects.clear();

    if (!handActive) return;

    for (let h = 0; h < activeHandCount; h++) {
        const hp = handWorldPositions[h];
        // Cast ray upward from hand position (since camera looks up, objects are above)
        const direction = new THREE.Vector3(0, 1, 0);
        raycaster.set(hp, direction);
        raycaster.far = 20;

        // Also check nearby objects with proximity (raycasting can miss small geometry)
        let closestObj = null, closestDist = 6; // max proximity radius
        rayTargets.forEach(obj => {
            const worldPos = new THREE.Vector3();
            obj.getWorldPosition(worldPos);
            const d = hp.distanceTo(worldPos);
            if (d < closestDist) {
                closestDist = d;
                closestObj = obj;
            }
        });

        // Prefer raycasting hit, fall back to proximity
        const hits = raycaster.intersectObjects(rayTargets, true);
        const hitObj = hits.length > 0 ? hits[0].object : closestObj;

        if (hitObj) {
            const obj = hitObj;
            const ud = obj.userData;

            // Highlight the targeted object (blue glow)
            if (obj.material && obj.material.emissive) {
                if (obj.material._origEmissive === undefined) {
                    obj.material._origEmissive = obj.material.emissive.getHex();
                }
                const glowIntensity = Math.max(0.2, 0.6 - closestDist * 0.06);
                obj.material.emissive.setHex(0x44aaff);
                obj.material.emissive.multiplyScalar(glowIntensity / 0.3);
                highlightedObjects.add(obj);
            }

            // Apply push force to the targeted object
            if (ud.type === 'fish') {
                const fish = fishes[ud.index];
                if (fish) {
                    const g = fish.group;
                    const dx = g.position.x - hp.x;
                    const dz = g.position.z - hp.z;
                    const dy = g.position.y - hp.y;
                    const dist = Math.sqrt(dx*dx + dz*dz + dy*dy);
                    if (dist > 0.1) {
                        const force = 0.6;
                        fish.pushVelocity.set(dx/dist*force, dy/dist*force*0.3, dz/dist*force);
                        fish.scared = Math.min(fish.scared + 0.4, 1.0);
                        spawnInterBubbles(g.position.x, g.position.y, g.position.z, 3);
                    }
                }
            } else if (ud.type === 'lotus') {
                const leaf = lotusLeaves[ud.index];
                if (leaf && leaf.interactive) {
                    const m = leaf.mesh;
                    const dx = m.position.x - hp.x;
                    const dz = m.position.z - hp.z;
                    const dist = Math.sqrt(dx*dx + dz*dz) || 1;
                    const force = 0.2;
                    leaf.pushVelocity.x += dx/dist * force;
                    leaf.pushVelocity.z += dz/dist * force;
                }
            } else if (ud.type === 'weed') {
                const weed = weeds[ud.index];
                if (weed && weed.interactive) {
                    const g = weed.group;
                    const dx = g.position.x - hp.x;
                    const dz = g.position.z - hp.z;
                    weed.pushStrength = Math.min(weed.pushStrength + 0.03, 0.5);
                    weed.pushAngle = Math.atan2(dz, dx);
                }
            }
        }
    }
}

// --- 2a. Water surface ---
function createWaterSurface() {
    const geo = new THREE.PlaneGeometry(200, 200, 60, 60);
    const mat = new THREE.MeshPhongMaterial({
        color: 0x88ccdd, transparent: true, opacity: 0.15,
        side: THREE.DoubleSide, shininess: 100
    });
    const surface = new THREE.Mesh(geo, mat);
    surface.rotation.x = -Math.PI / 2;
    surface.position.y = 25;
    scene.add(surface);
    const causticGeo = new THREE.PlaneGeometry(200, 200, 40, 40);
    const causticMat = new THREE.MeshBasicMaterial({
        color: 0x66bbdd, transparent: true, opacity: 0.08,
        side: THREE.DoubleSide
    });
    const caustic = new THREE.Mesh(causticGeo, causticMat);
    caustic.rotation.x = -Math.PI / 2;
    caustic.position.y = 24.5;
    scene.add(caustic);
    scene.userData.waterSurface = surface;
    scene.userData.caustic = caustic;
}

// --- 2b. God Rays ---
function createGodRays() {
    const rayCount = 12;
    for (let i = 0; i < rayCount; i++) {
        const width = 2 + Math.random() * 5;
        const height = 25 + Math.random() * 10;
        const geo = new THREE.PlaneGeometry(width, height);
        const isWarm = Math.random() > 0.4;
        const rayColor = isWarm ? 0xffeebb : 0xddeeff;
        const mat = new THREE.MeshBasicMaterial({
            color: rayColor, transparent: true,
            opacity: 0.06 + Math.random() * 0.08,
            side: THREE.DoubleSide, depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const ray = new THREE.Mesh(geo, mat);
        const angle = (i / rayCount) * Math.PI * 2;
        const radius = 3 + Math.random() * 15;
        ray.position.set(Math.cos(angle) * radius, 10 + Math.random() * 10, Math.sin(angle) * radius);
        ray.rotation.x = (Math.random() - 0.5) * 0.3;
        ray.rotation.z = (Math.random() - 0.5) * 0.3;
        scene.add(ray);
        godRays.push({
            mesh: ray, baseOpacity: mat.opacity, phase: Math.random() * Math.PI * 2,
            speed: 0.3 + Math.random() * 0.5, baseX: ray.position.x, baseZ: ray.position.z
        });
    }
}

// --- 2c. Fish (3D geometry, noise-driven swimming) ---
function createFishes() {
    const fishCount = 18; // More fish across the scene
    for (let i = 0; i < fishCount; i++) {
        const group = new THREE.Group();

        // Fish body (ellipsoid)
        const bodyGeo = new THREE.SphereGeometry(0.5, 8, 6);
        bodyGeo.scale(1.8, 0.6, 0.8);
        const hue = 0.05 + Math.random() * 0.1; // Orange-gold range
        const bodyColor = new THREE.Color().setHSL(hue, 0.7, 0.55);
        const bodyMat = new THREE.MeshPhongMaterial({
            color: bodyColor,
            transparent: true,
            opacity: 0.85,
            shininess: 40
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        group.add(body);

        // Fish tail (triangle, vertex A at body junction serves as rotation pivot)
        // Three vertices: A (connection/pivot) = origin, B and C are the two tail ends
        const tailVertices = new Float32Array([
            0, 0, 0,           // A: pivot vertex, at body end
            -0.9, 0.45, 0,     // B: tail upper end
            -0.9, -0.45, 0     // C: tail lower end
        ]);
        const tailGeo = new THREE.BufferGeometry();
        tailGeo.setAttribute('position', new THREE.BufferAttribute(tailVertices, 3));
        tailGeo.setIndex([0, 1, 2]);
        tailGeo.computeVertexNormals();
        const tailMat = new THREE.MeshPhongMaterial({
            color: bodyColor.clone().multiplyScalar(0.8),
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide
        });
        const tail = new THREE.Mesh(tailGeo, tailMat);
        // Pivot is vertex A = origin, placed at the body's tail end
        tail.position.x = -0.85;
        group.add(tail);

        // Dorsal fin
        const finGeo = new THREE.PlaneGeometry(0.5, 0.3);
        const finMat = new THREE.MeshPhongMaterial({
            color: bodyColor.clone().multiplyScalar(0.9),
            transparent: true,
            opacity: 0.6,
            side: THREE.DoubleSide
        });
        const fin = new THREE.Mesh(finGeo, finMat);
        fin.position.set(0, 0.35, 0);
        fin.rotation.x = 0.3;
        group.add(fin);

        // Random initial position (with ample spacing)
        const angle = (i / fishCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        const dist = 8 + Math.random() * 15;
        group.position.set(
            Math.cos(angle) * dist,
            6 + Math.random() * 12,
            Math.sin(angle) * dist
        );

        const scale = 0.6 + Math.random() * 0.5;
        group.scale.setScalar(scale);
        scene.add(group);

        // Tag body mesh so raycaster can identify it
        body.userData.type = 'fish';
        body.userData.index = i;

        fishes.push({
            group: group,
            body: body,
            tail: tail,
            // Noise params: each fish has a unique offset
            noiseOffsetX: Math.random() * 100,
            noiseOffsetZ: Math.random() * 100,
            noiseOffsetY: Math.random() * 100,
            speed: 0.15 + Math.random() * 0.2,
            baseY: group.position.y,
            // Hand interaction
            pushVelocity: new THREE.Vector3(0, 0, 0),
            pushDecay: 0.93,
            scared: 0  // 0~1, decays over time, drives tail speed + bubbles
        });
    }
}

// --- 2d. Lotus leaves (evenly spread across view, varied sizes, near ones interactive) ---
function createLotusLeaves() {
    // Grid + random offset ensures even spread, no clustering
    // Divide XZ plane into grid cells, place one leaf per cell
    const gridSize = 8;
    const cellSize = 10;

    for (let gx = 0; gx < gridSize; gx++) {
        for (let gz = 0; gz < gridSize; gz++) {
            // Skip more cells to reduce overlap (~40% fill rate)
            if (Math.random() > 0.4) continue;

            // Cell center + random offset
            const cx = (gx - gridSize / 2 + 0.5) * cellSize + (Math.random() - 0.5) * cellSize * 0.7;
            const cz = (gz - gridSize / 2 + 0.5) * cellSize + (Math.random() - 0.5) * cellSize * 0.7;
            const distFromCenter = Math.sqrt(cx * cx + cz * cz);

            // Size and interactivity based on distance from center
            // Near (dist < 25): large leaves, interactive
            // Far (>25): small decorative leaves
            let radius, opacity, interactive;
            if (distFromCenter < 25) {
                radius = 2.0 + Math.random() * 2.5;  // 2~4.5, fits within 10-unit cells
                opacity = 0.5 + Math.random() * 0.25;
                interactive = true;
            } else {
                radius = 0.6 + Math.random() * 1.2;  // 0.6~1.8
                opacity = 0.2 + Math.random() * 0.1;
                interactive = false;
            }

            // Y height: lower when near (closer to you), higher when far (near water surface)
            const yPos = mapRange(clamp(distFromCenter, 0, 40), 0, 40, 18, 24.5);

            // Lotus leaf shape (disc + V-shaped notch)
            const shape = new THREE.Shape();
            const segments = 32;
            const gapStart = Math.random() * Math.PI * 2;
            const gapSize = 0.3;
            for (let s = 0; s <= segments; s++) {
                const theta = (s / segments) * Math.PI * 2;
                let r = radius;
                let diff = theta - gapStart;
                if (diff < 0) diff += Math.PI * 2;
                if (diff > Math.PI) diff = Math.PI * 2 - diff;
                if (diff < gapSize) r *= 0.3;
                const x = Math.cos(theta) * r;
                const y = Math.sin(theta) * r;
                if (s === 0) shape.moveTo(x, y);
                else shape.lineTo(x, y);
            }

            const geo = new THREE.ShapeGeometry(shape);
            const mat = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(0.33 + Math.random() * 0.08, 0.45 + Math.random() * 0.15, 0.18 + Math.random() * 0.15),
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide
            });
            const leaf = new THREE.Mesh(geo, mat);
            leaf.rotation.x = -Math.PI / 2;
            // Random rotation per leaf for a more natural look
            leaf.rotation.z = Math.random() * Math.PI * 2;
            leaf.position.set(cx, yPos + Math.random() * 0.5, cz);

            // Veins: radiate evenly from center across 360°
            const veinsGroup = new THREE.Group();
            const veinCount = interactive ? 14 : 6;
            for (let v = 0; v < veinCount; v++) {
                const veinAngle = (v / veinCount) * Math.PI * 2;
                // End point at leaf edge
                const endX = Math.cos(veinAngle) * radius * 0.88;
                const endZ = Math.sin(veinAngle) * radius * 0.88;
                // Midpoint with slight bend
                const midR = radius * 0.45;
                const midX = Math.cos(veinAngle + (Math.random() - 0.5) * 0.15) * midR;
                const midZ = Math.sin(veinAngle + (Math.random() - 0.5) * 0.15) * midR;

                const veinPoints = [
                    new THREE.Vector3(0, 0.02, 0),   // 中心
                    new THREE.Vector3(midX, 0.02, midZ),
                    new THREE.Vector3(endX, 0.02, endZ)
                ];
                const veinCurve = new THREE.CatmullRomCurve3(veinPoints);
                const curvePoints = veinCurve.getPoints(8);
                const veinGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
                const veinMat = new THREE.LineBasicMaterial({
                    color: 0x2a6a35, transparent: true,
                    opacity: interactive ? 0.4 : 0.2
                });
                veinsGroup.add(new THREE.Line(veinGeo, veinMat));
            }
            veinsGroup.rotation.x = -Math.PI / 2;
            veinsGroup.rotation.z = leaf.rotation.z; // follow leaf rotation
            veinsGroup.position.copy(leaf.position);
            // Tag leaf for raycasting
            if (interactive) {
                leaf.userData.type = 'lotus';
                leaf.userData.index = lotusLeaves.length;
            }

            scene.add(veinsGroup);
            scene.add(leaf);

            lotusLeaves.push({
                mesh: leaf,
                veins: veinsGroup,
                noiseOffset: Math.random() * 100,
                baseX: leaf.position.x,
                baseZ: leaf.position.z,
                baseY: leaf.position.y,
                pushVelocity: new THREE.Vector3(0, 0, 0),
                pushDecay: 0.94,
                interactive: interactive
            });
        }
    }
}

// --- 2e. Seaweed (multi-layer: near large clumps interactive, far small clumps decorative) ---
function createWeeds() {
    // Near: large interactive seaweed, tall and thick
    // Mid: medium seaweed
    // Far: small decorative seaweed, short and translucent
    // Two layers only: near interactive + far decorative, similar depth range as lotus leaves
    const layers = [
        { count: 10, heightMin: 5, heightMax: 11, stalkMin: 3, stalkMax: 5, thickness: 0.07, distMin: 3,  distMax: 18, opac: 0.75, interactive: true },
        { count: 12, heightMin: 2, heightMax: 6,  stalkMin: 2, stalkMax: 4, thickness: 0.04, distMin: 14, distMax: 28, opac: 0.3, interactive: false },
    ];

    layers.forEach(layer => {
        for (let i = 0; i < layer.count; i++) {
            const group = new THREE.Group();
            const stalkCount = layer.stalkMin + Math.floor(Math.random() * (layer.stalkMax - layer.stalkMin + 1));
            const stalks = [];

            for (let s = 0; s < stalkCount; s++) {
                const height = layer.heightMin + Math.random() * (layer.heightMax - layer.heightMin);
                const segments = 8;
                const points = [];
                for (let p = 0; p <= segments; p++) {
                    points.push(new THREE.Vector3(
                        (Math.random() - 0.5) * 0.3,
                        (p / segments) * height,
                        (Math.random() - 0.5) * 0.3
                    ));
                }
                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 12, layer.thickness + Math.random() * 0.03, 5, false);
                const tubeMat = new THREE.MeshPhongMaterial({
                    color: new THREE.Color().setHSL(0.28 + Math.random() * 0.12, 0.45 + Math.random() * 0.15, 0.18 + Math.random() * 0.15),
                    transparent: true,
                    opacity: layer.opac,
                    side: THREE.DoubleSide
                });
                const stalk = new THREE.Mesh(tubeGeo, tubeMat);
                stalk.position.x = (Math.random() - 0.5) * 0.5;
                stalk.position.z = (Math.random() - 0.5) * 0.5;
                group.add(stalk);
                stalks.push({ mesh: stalk, points: points, curve: curve, height: height });

                // Leaf blades (more leaves on near seaweed)
                const leafChance = layer.interactive ? 0.6 : 0.3;
                if (Math.random() < leafChance) {
                    const leafW = (layer.interactive ? 0.6 : 0.3) + Math.random() * 0.4;
                    const leafH = (layer.interactive ? 1.5 : 0.8) + Math.random() * 0.8;
                    const leafGeo = new THREE.PlaneGeometry(leafW, leafH);
                    const leafMat = new THREE.MeshPhongMaterial({
                        color: new THREE.Color().setHSL(0.28 + Math.random() * 0.1, 0.6, 0.22),
                        transparent: true,
                        opacity: layer.opac * 0.85,
                        side: THREE.DoubleSide
                    });
                    const leafMesh = new THREE.Mesh(leafGeo, leafMat);
                    leafMesh.position.set(
                        (Math.random() - 0.5) * 0.3,
                        height * (0.4 + Math.random() * 0.4),
                        (Math.random() - 0.5) * 0.3
                    );
                    leafMesh.rotation.set(Math.random() * 0.5, Math.random() * Math.PI, Math.random() * 0.3);
                    group.add(leafMesh);
                }
            }

            const angle = (i / layer.count) * Math.PI * 2 + (Math.random() - 0.5) * 1.0;
            const dist = layer.distMin + Math.random() * (layer.distMax - layer.distMin);
            group.position.set(
                Math.cos(angle) * dist,
                -2,
                Math.sin(angle) * dist
            );

            // Tag weed stalks for raycasting
            if (layer.interactive) {
                group.children.forEach(child => {
                    child.userData.type = 'weed';
                    child.userData.index = weeds.length;
                });
            }

            scene.add(group);
            weeds.push({
                group: group,
                stalks: stalks,
                noiseOffset: Math.random() * 100,
                pushAngle: 0,
                pushStrength: 0,
                pushDecay: 0.95,
                interactive: layer.interactive
            });
        }
    });
}

// --- 2f. Bubbles (tiny floating particles) ---
function createBubbles() {
    const bubbleCount = 40;
    const positions = new Float32Array(bubbleCount * 3);
    for (let i = 0; i < bubbleCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 60;
        positions[i * 3 + 1] = Math.random() * 25;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({
        color: 0xaaddff,
        size: 0.15,
        transparent: true,
        opacity: 0.4,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const bubbles = new THREE.Points(geo, mat);
    scene.add(bubbles);
    scene.userData.bubbles = bubbles;

    // Interaction bubble pool (spawned when fish get scared)
    const interBubbleCount = 30;
    const ibPositions = new Float32Array(interBubbleCount * 3);
    const ibGeo = new THREE.BufferGeometry();
    ibGeo.setAttribute('position', new THREE.BufferAttribute(ibPositions, 3));
    const ibMat = new THREE.PointsMaterial({
        color: 0xccffff,
        size: 0.2,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const interBubbles = new THREE.Points(ibGeo, ibMat);
    scene.add(interBubbles);
    scene.userData.interBubbles = interBubbles;
    // Each bubble has: active flag, velocity, life
    scene.userData.interBubbleData = [];
    for (let i = 0; i < interBubbleCount; i++) {
        scene.userData.interBubbleData.push({ active: false, vx: 0, vy: 0, vz: 0, life: 0 });
        ibPositions[i * 3 + 1] = -100; // hide offscreen
    }
}

// --- 3. Webcam + ml5 initialization ---
async function initWebcam() {
    video = document.getElementById('webcam');
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        await new Promise(r => { video.onloadedmetadata = r; });
    } catch (e) {
        statusEl.innerText = 'Cannot access webcam. Please check permissions.';
        console.error(e);
    }
}

function initMl5() {
    // ml5 handles facemesh only
    faceMesh = ml5.facemesh(video, () => {
        isFaceReady = true;
        checkReady();
    });
    faceMesh.on('predict', r => { facePredictions = r; });

    // MediaPipe Hands handles dual hand detection
    const mpHands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    mpHands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
    });
    mpHands.onResults((results) => {
        mpHandResults = results;
        if (!isHandReady) {
            isHandReady = true;
            checkReady();
        }
    });

    // Continuously feed frames to MediaPipe
    async function feedHands() {
        if (video.readyState >= 2) {
            try { await mpHands.send({ image: video }); } catch(e) {}
        }
        requestAnimationFrame(feedHands);
    }
    feedHands();
}

function checkReady() {
    if (isFaceReady && isHandReady) {
        statusEl.innerText = 'underwater！';
    } else if (isFaceReady) {
        statusEl.innerText = 'facemesh wait for handpose...';
    } else if (isHandReady) {
        statusEl.innerText = 'handpose wait for facemesh...';
    }
}

// --- 4. Main animation loop ---
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    debugEl.innerHTML = '';
    updateHeadTracking(t);
    updateHandTracking(t);
    updateRaycasting();
    updateFishes(t);
    updateLotusLeaves(t);
    updateWeeds(t);
    updateEnvironment(t);
    renderer.render(scene, camera);
}

// --- 4a. Head tracking → horizontal camera panning (no rotation) ---
// Stabilization: EMA smooth ratio → dead zone filter → slow lerp output
const MAX_PAN_DISTANCE = 12;
let currentPanX = 0;
let smoothedRatio = 0;       // EMA-smoothed raw ratio
let lockedPanX = 0;          // current locked target position
const DEAD_ZONE = 0.015;     // ignore ratio changes smaller than this
const EMA_ALPHA = 0.12;      // EMA coefficient for ratio (smaller = smoother)
const PAN_LERP = 0.01;       // final position lerp speed (very slow, stable)

function updateHeadTracking(t) {
    if (!isFaceReady || facePredictions.length === 0) return;

    const kp = facePredictions[0].scaledMesh;
    const nose = kp[1], leftEye = kp[33], rightEye = kp[263];

    const distL = dist2D(nose[0], nose[1], leftEye[0], leftEye[1]);
    const distR = dist2D(nose[0], nose[1], rightEye[0], rightEye[1]);
    const rawRatio = (distL - distR) / (distL + distR);

    // 1. EMA smooth the raw signal (remove frame-to-frame noise)
    smoothedRatio += (rawRatio - smoothedRatio) * EMA_ALPHA;

    // 2. Map to target pan amount
    const mappedTarget = clamp(
        mapRange(smoothedRatio, 0.2, -0.2, -MAX_PAN_DISTANCE, MAX_PAN_DISTANCE),
        -MAX_PAN_DISTANCE, MAX_PAN_DISTANCE
    );

    // 3. Dead zone: only update locked position when change exceeds threshold
    const panDelta = Math.abs(mappedTarget - lockedPanX);
    if (panDelta > DEAD_ZONE * MAX_PAN_DISTANCE * 2) {
        // Change large enough, update target (still using lerp, not jumping)
        lockedPanX += (mappedTarget - lockedPanX) * 0.15;
    }

    // 4. Final output: very slowly approach locked position
    currentPanX += (lockedPanX - currentPanX) * PAN_LERP;
    cameraGroup.position.x = currentPanX;

    debugEl.innerHTML += `Pan: ${currentPanX.toFixed(1)} / ±${MAX_PAN_DISTANCE}`;
}

// --- 4b. Hand tracking + dual hand outline rendering (MediaPipe Hands) ---
// MediaPipe coords are normalized (0~1), x-right y-down z-depth (closer to cam = negative)
// Supine perspective mapping:
//   MP x (0→1) → 3D X: not flipped (camera is already mirrored, cancels out)
//   MP y (0→1) → 3D Z: flipped (camera top = world far)
//   MP z → 3D Y offset: closer to cam (z more negative) → arm more extended → further in underwater world → draw smaller
function mpToWorld(lm) {
    // Mirror X: webcam is horizontally flipped, so x: 1→-15, 0→15
    const x = mapRange(lm.x, 0, 1, 15, -15);
    const z = mapRange(lm.y, 0, 1, 12, -12);
    const y = 10 + (lm.z || 0) * -8;
    return { x, y, z };
}

// Hand scale: using horizontal distance a between leftmost and rightmost keypoints
// a larger (hand appears wider on camera) → draw smaller in scene
function getHandScale(landmarks, handIndex) {
    // Wrist(0) to middle finger base(9) distance — skeletal palm length, invariant to finger pose
    const wrist = landmarks[0], midBase = landmarks[9];
    const a = Math.sqrt((wrist.x - midBase.x) ** 2 + (wrist.y - midBase.y) ** 2);
    const scale = Math.max(mapRange(a, 0.04, 0.1, 1.2, 0.4), 0.4);
    debugEl.innerHTML += `<br>Hand${handIndex}: a=${a.toFixed(3)} scale=${scale.toFixed(2)}`;
    return scale;
}

function updateHandTracking(t) {
    activeHandCount = 0;

    const hands = mpHandResults && mpHandResults.multiHandLandmarks;
    if (!isHandReady || !hands || hands.length === 0) {
        handActive = false;
        for (let h = 0; h < 2; h++) {
            if (handLineMeshes[h]) handLineMeshes[h].visible = false;
            if (handGlows[h]) handGlows[h].visible = false;
        }
        return;
    }

    handActive = true;
    activeHandCount = Math.min(hands.length, 2);

    for (let h = 0; h < 2; h++) {
        if (h >= hands.length) {
            if (handLineMeshes[h]) handLineMeshes[h].visible = false;
            if (handGlows[h]) handGlows[h].visible = false;
            continue;
        }

        const landmarks = hands[h]; // 21 points, each {x, y, z}
        const palm = landmarks[9];
        const palmWorld = mpToWorld(palm);

        handWorldPositions[h].lerp(
            new THREE.Vector3(palmWorld.x, palmWorld.y, palmWorld.z), 0.15
        );

        // Hand scale ratio
        const handScale = getHandScale(landmarks, h);

        // --- Draw hand outline ---
        const lineMesh = handLineMeshes[h];
        if (lineMesh && landmarks.length >= 21) {
            lineMesh.visible = true;
            const positions = lineMesh.geometry.attributes.position;

            // Use smoothed palm world coords as anchor (unaffected by scale)
            const cw = handWorldPositions[h];
            // Hand width for normalization
            let _minX = Infinity, _maxX = -Infinity;
            for (let k = 0; k < landmarks.length; k++) {
                if (landmarks[k].x < _minX) _minX = landmarks[k].x;
                if (landmarks[k].x > _maxX) _maxX = landmarks[k].x;
            }
            const a = Math.max(_maxX - _minX, 0.01);
            const worldSize = 8;

            for (let i = 0; i < handArray.length; i++) {
                const lm = landmarks[handArray[i]];
                // Normalized offset (divide by a to cancel distance difference)
                const ndx = (lm.x - palm.x) / a;
                const ndy = (lm.y - palm.y) / a;
                const ndz = ((lm.z || 0) - (palm.z || 0)) / a;
                // Scale hand shape around smoothed palm center, without affecting inter-hand distance
                const sx = cw.x + ndx * handScale * worldSize * -1;
                const sy = cw.y + ndz * handScale * worldSize * -0.5;
                const sz = cw.z + ndy * handScale * worldSize * -1;
                positions.setXYZ(i, sx, sy, sz);
            }

            lineMesh.geometry.setDrawRange(0, handArray.length);
            positions.needsUpdate = true;
            lineMesh.material.opacity = 0.4 + Math.sin(t * 2 + h) * 0.15;
        }

        // Palm glow (size follows hand scale)
        const glow = handGlows[h];
        if (glow) {
            glow.visible = true;
            glow.position.copy(handWorldPositions[h]);
            glow.scale.setScalar(3 * handScale);
            glow.material.opacity = 0.3 + Math.sin(t * 1.5 + h * 0.5) * 0.1;
        }

    }
}

// --- 4c. Fish school noise swimming + hand interaction ---
function updateFishes(t) {
    fishes.forEach(fish => {
        const g = fish.group;
        const nx = PerlinNoise.noise(fish.noiseOffsetX + t * fish.speed, 0, 0);
        const nz = PerlinNoise.noise(0, fish.noiseOffsetZ + t * fish.speed, 0);
        const ny = PerlinNoise.noise(0, 0, fish.noiseOffsetY + t * fish.speed * 0.5);
        const moveX = nx * 0.12;
        const moveZ = nz * 0.12;
        const moveY = ny * 0.03;
        fish.pushVelocity.multiplyScalar(fish.pushDecay);
        g.position.x += moveX + fish.pushVelocity.x;
        g.position.z += moveZ + fish.pushVelocity.z;
        g.position.y = fish.baseY + ny * 2 + fish.pushVelocity.y;

        const maxDist = 35;
        g.position.x = clamp(g.position.x, -maxDist, maxDist);
        g.position.z = clamp(g.position.z, -maxDist, maxDist);
        const facing = Math.atan2(moveZ + fish.pushVelocity.z, moveX + fish.pushVelocity.x);
        g.rotation.y += (facing - g.rotation.y) * 0.05;
        if (fish.tail) {
            const tailFreq = 4 + fish.scared * 12;
            const tailAmp = 0.4 + fish.scared * 0.5;
            fish.tail.rotation.y = Math.sin(t * tailFreq + fish.noiseOffsetX) * tailAmp;
        }
        fish.scared *= 0.96;
    });
}

// --- 4d. Lotus leaf drifting + hand interaction ---
function updateLotusLeaves(t) {
    lotusLeaves.forEach(leaf => {
        const m = leaf.mesh;
        const driftX = PerlinNoise.noise(leaf.noiseOffset + t * 0.1, 0) * 0.02;
        const driftZ = PerlinNoise.noise(0, leaf.noiseOffset + t * 0.1) * 0.02;
        const bob = PerlinNoise.noise(leaf.noiseOffset, t * 0.3) * 0.3;
        leaf.pushVelocity.multiplyScalar(leaf.pushDecay);
        m.position.x = leaf.baseX + driftX + leaf.pushVelocity.x;
        m.position.z = leaf.baseZ + driftZ + leaf.pushVelocity.z;
        m.position.y = leaf.baseY + bob;
        m.rotation.z = PerlinNoise.noise(leaf.noiseOffset + 50, t * 0.2) * 0.1;
        leaf.veins.position.copy(m.position);
        leaf.veins.rotation.z = m.rotation.z;
        leaf.baseX += (leaf.mesh.position.x - leaf.baseX) * 0.001;
        leaf.baseZ += (leaf.mesh.position.z - leaf.baseZ) * 0.001;
    });
}

// --- 4e. Seaweed swaying + hand interaction ---
function updateWeeds(t) {
    weeds.forEach(weed => {
        const g = weed.group;
        const sway = PerlinNoise.noise(weed.noiseOffset + t * 0.3, 0) * 0.15;
        weed.pushStrength *= weed.pushDecay;
        const totalBend = sway + weed.pushStrength * Math.sin(weed.pushAngle);
        const totalBendZ = PerlinNoise.noise(0, weed.noiseOffset + t * 0.25) * 0.08
                          + weed.pushStrength * Math.cos(weed.pushAngle);
        g.rotation.x = totalBendZ;
        g.rotation.z = totalBend;
    });
}

function updateEnvironment(t) {
    godRays.forEach(ray => {
        const flicker = PerlinNoise.noise(ray.phase + t * ray.speed, 0);
        ray.mesh.material.opacity = ray.baseOpacity * (0.5 + flicker * 0.7);
        ray.mesh.position.x = ray.baseX + Math.sin(t * 0.2 + ray.phase) * 0.5;
        ray.mesh.position.z = ray.baseZ + Math.cos(t * 0.15 + ray.phase) * 0.5;
    });
    const surface = scene.userData.waterSurface;
    if (surface) {
        const positions = surface.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i);
            const z = positions.getZ(i);
            const wave = PerlinNoise.noise(x * 0.05 + t * 0.3, z * 0.05 + t * 0.2) * 0.8;
            positions.setY(i, wave);
        }
        positions.needsUpdate = true;
    }
    const bubbles = scene.userData.bubbles;
    if (bubbles) {
        const positions = bubbles.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
            let y = positions.getY(i);
            y += 0.01 + Math.random() * 0.01;
            if (y > 26) y = -2;
            positions.setY(i, y);
            positions.setX(i, positions.getX(i) + (Math.random() - 0.5) * 0.02);
        }
        positions.needsUpdate = true;
    }
    const ib = scene.userData.interBubbles;
    if (ib) {
        const ibPos = ib.geometry.attributes.position;
        const ibData = scene.userData.interBubbleData;
        for (let i = 0; i < ibData.length; i++) {
            const d = ibData[i];
            if (!d.active) continue;
            d.life -= 0.016;
            if (d.life <= 0) {
                d.active = false;
                ibPos.setXYZ(i, 0, -100, 0);
            } else {
                ibPos.setX(i, ibPos.getX(i) + d.vx);
                ibPos.setY(i, ibPos.getY(i) + d.vy);
                ibPos.setZ(i, ibPos.getZ(i) + d.vz);
                d.vy += 0.003;
            }
        }
        ibPos.needsUpdate = true;
    }
}

// Spawn a burst of interaction bubbles at a position
function spawnInterBubbles(x, y, z, count) {
    const ibPos = scene.userData.interBubbles?.geometry.attributes.position;
    const ibData = scene.userData.interBubbleData;
    if (!ibPos || !ibData) return;
    let spawned = 0;
    for (let i = 0; i < ibData.length && spawned < count; i++) {
        if (!ibData[i].active) {
            ibData[i].active = true;
            ibData[i].life = 0.8 + Math.random() * 0.6;
            ibData[i].vx = (Math.random() - 0.5) * 0.15;
            ibData[i].vy = 0.03 + Math.random() * 0.05;
            ibData[i].vz = (Math.random() - 0.5) * 0.15;
            ibPos.setXYZ(i, x + (Math.random() - 0.5) * 1, y, z + (Math.random() - 0.5) * 1);
            spawned++;
        }
    }
}

// --- Utility functions ---
function dist2D(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}
function mapRange(val, a1, a2, b1, b2) {
    return b1 + (val - a1) * (b2 - b1) / (a2 - a1);
}
function clamp(val, min, max) {
    return Math.min(Math.max(val, min), max);
}
